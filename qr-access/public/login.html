<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Sign In — Oasis Pulse</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#060d1c;--card:#0d1829;--border:#1e2d45;
      --blue:#2563eb;--blue-mid:#3b82f6;--blue-glow:rgba(37,99,235,.3);
      --text:#f1f5f9;--muted:#64748b;--success:#10b981;--danger:#ef4444;
    }
    body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;-webkit-font-smoothing:antialiased;}
    .bg{position:fixed;inset:0;z-index:0;pointer-events:none;}
    .bg-orb{position:absolute;border-radius:50%;filter:blur(110px);}
    .bg-orb:nth-child(1){width:500px;height:500px;background:rgba(37,99,235,.14);top:-180px;left:-120px;}
    .bg-orb:nth-child(2){width:400px;height:400px;background:rgba(59,130,246,.09);bottom:-100px;right:-80px;}
    .bg-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(59,130,246,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(59,130,246,.04) 1px,transparent 1px);background-size:52px 52px;}
    .shell{position:relative;z-index:1;width:100%;max-width:420px;}

    .verified-banner{display:flex;align-items:center;gap:.65rem;background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);border-radius:12px;padding:.75rem 1rem;margin-bottom:1.25rem;font-size:.8rem;color:#6ee7b7;font-weight:600;}
    .v-dot{width:8px;height:8px;border-radius:50%;background:var(--success);flex-shrink:0;animation:vp 2s infinite;}
    @keyframes vp{0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,.4)}50%{box-shadow:0 0 0 5px rgba(16,185,129,0)}}
    .verified-banner svg{width:16px;height:16px;flex-shrink:0;}

    .card{background:var(--card);border:1px solid var(--border);border-radius:22px;padding:2.25rem;box-shadow:0 24px 80px rgba(0,0,0,.5);}
    .card-brand{display:flex;align-items:center;gap:.75rem;margin-bottom:1.75rem;}
    .brand-icon{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--blue),var(--blue-mid));display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px var(--blue-glow);}
    .brand-icon svg{width:22px;height:22px;color:#fff;}
    .brand-name{font-size:1rem;font-weight:800;line-height:1.1;}
    .brand-tag{font-size:.62rem;color:var(--blue-mid);text-transform:uppercase;letter-spacing:.09em;font-weight:600;}
    h1{font-size:1.4rem;font-weight:800;margin-bottom:.35rem;letter-spacing:-.02em;}
    .sub{color:var(--muted);font-size:.875rem;margin-bottom:1.75rem;line-height:1.55;}

    .field{margin-bottom:.95rem;}
    .field label{display:block;font-size:.71rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.38rem;}
    .input-wrap{position:relative;}
    .input-icon{position:absolute;left:.875rem;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;}
    .input-icon svg{width:15px;height:15px;display:block;}
    input{width:100%;padding:.75rem 1rem .75rem 2.55rem;background:#07111f;border:1.5px solid var(--border);border-radius:10px;font-size:.88rem;font-family:inherit;color:var(--text);outline:none;transition:border-color .18s;}
    input::placeholder{color:#273548;}
    input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.15);}
    .pw-eye{position:absolute;right:.875rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--muted);display:flex;transition:color .18s;padding:.2rem;}
    .pw-eye:hover{color:var(--text);}
    .pw-eye svg{width:15px;height:15px;}

    .alert{display:none;align-items:flex-start;gap:.5rem;padding:.72rem .9rem;border-radius:9px;font-size:.83rem;margin-bottom:.875rem;}
    .alert.show{display:flex;}
    .alert-error{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#fca5a5;}
    .alert svg{width:15px;height:15px;flex-shrink:0;margin-top:.1rem;}

    .btn{width:100%;padding:.9rem;border:none;border-radius:12px;background:linear-gradient(135deg,var(--blue),var(--blue-mid));color:#fff;font-size:.95rem;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 5px 20px var(--blue-glow);transition:all .22s;display:flex;align-items:center;justify-content:center;gap:.55rem;margin-top:.5rem;}
    .btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 10px 32px rgba(37,99,235,.55);}
    .btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
    .btn svg{width:18px;height:18px;flex-shrink:0;}
    .spinner{width:17px;height:17px;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .65s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg)}}

    .id-hint{font-size:.75rem;color:var(--muted);margin-bottom:1rem;padding:.5rem .875rem;background:#07111f;border-radius:8px;border:1px solid var(--border);}
    .link-row{text-align:center;margin-top:1rem;font-size:.8rem;color:var(--muted);}
    .link-row a{color:var(--blue-mid);font-weight:600;text-decoration:none;}
    .link-row a:hover{text-decoration:underline;}
  </style>
</head>
<body>
<div class="bg"><div class="bg-orb"></div><div class="bg-orb"></div><div class="bg-grid"></div></div>

<div class="shell">
  <div class="verified-banner" id="v-banner" style="display:none;">
    <span class="v-dot"></span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    Invitation verified — you may sign in
  </div>

  <div class="card">
    <div class="card-brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      </div>
      <div><div class="brand-name">Oasis Pulse</div><div class="brand-tag">Attendance System</div></div>
    </div>

    <h1>Welcome back</h1>
    <p class="sub">Sign in using your Tracking ID — the unique code you received when you registered.</p>

    <div class="id-hint">💡 Your Tracking ID starts with <strong>OT-</strong> and is 8 characters long, e.g. <strong>OT-AB12C</strong></div>

    <div class="alert" id="alert"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg><span id="alert-text"></span></div>

    <form id="login-form" novalidate autocomplete="off">
      <div class="field">
        <label>Tracking ID</label>
        <div class="input-wrap">
          <span class="input-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
          <input type="text" id="tracking-id" placeholder="OT-XXXXX" maxlength="8"
                 autocapitalize="characters" spellcheck="false" autocomplete="off"
                 style="font-family:'JetBrains Mono',monospace;letter-spacing:.18em;font-size:1.2rem;font-weight:700;text-align:center;text-transform:uppercase;"/>
        </div>
      </div>
      <button type="submit" class="btn" id="login-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        Clock In / Clock Out
      </button>
    </form>
    <div class="link-row">Don't have an account? <a href="validate.html">Use your invitation QR</a></div>
  </div>
</div>

<script src="js/config.js"></script>
<script>
'use strict';
// Gate check
const sess = QR_CONFIG.requireSession();
if (sess) document.getElementById('v-banner').style.display = 'flex';

// Auto-format tracking ID
document.getElementById('tracking-id').addEventListener('input', function() {
  let v = this.value.toUpperCase().replace(/[^A-Z0-9-]/g,'');
  if (v.length && !v.startsWith('OT-')) {
    v = v.startsWith('OT') ? 'OT-' + v.slice(2) : 'OT-' + v;
  }
  this.value = v;
});

document.getElementById('login-form').addEventListener('submit', async e => {
  e.preventDefault();
  const alertEl = document.getElementById('alert');
  alertEl.classList.remove('show');

  const trackingId = document.getElementById('tracking-id').value.trim().toUpperCase();
  if (!trackingId || trackingId.length < 4) {
    document.getElementById('alert-text').textContent = 'Please enter your Tracking ID (e.g. OT-AB12C).';
    alertEl.className = 'alert show alert-error'; return;
  }

  const btn = document.getElementById('login-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>&nbsp;Checking…';

  try {
    const res  = await fetch('/api/attendance/punch', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ clock_in_id: trackingId })
    });
    const data = await res.json();

    if (res.ok || res.status === 201) {
      sessionStorage.removeItem('qr_session');
      if (data.token) localStorage.setItem('tm_token', data.token);
      if (data.student) localStorage.setItem('tm_user', JSON.stringify(data.student));
      document.getElementById('alert-text').textContent = data.message || 'Success! Redirecting…';
      alertEl.className = 'alert show alert-success';
      alertEl.querySelector('svg').innerHTML = '<polyline points="20 6 9 17 4 12"/>';
      setTimeout(() => { location.href = '../index.html'; }, 1600);
    } else {
      document.getElementById('alert-text').textContent = data.error || 'Invalid Tracking ID.';
      alertEl.className = 'alert show alert-error';
      btn.disabled = false;
      btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;flex-shrink:0"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg> Clock In / Clock Out`;
    }
  } catch {
    document.getElementById('alert-text').textContent = 'Connection error. Please try again.';
    alertEl.className = 'alert show alert-error';
    btn.disabled = false;
    btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;flex-shrink:0"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg> Clock In / Clock Out`;
  }
});
</script>
</body>
</html>
